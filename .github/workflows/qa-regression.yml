name: QA regression gate

# The real gate: runs the full pipeline against a live LaRuche, then compares
# the result to the committed baseline. Fails the build when the chatbot got
# worse.
#
# This needs a SELF-HOSTED runner. A full run requires the three uvicorn
# services, the Vite frontend, Chrome and Ollama with qwen2.5:3b on a GPU —
# none of which exist on GitHub's hosted runners, and CPU-only inference would
# be far too slow. Setup instructions: .github/workflows/README.md
#
# Trigger it manually, or nightly, rather than on every push: a full corpus run
# takes minutes and holds the machine's GPU.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "LaRuche frontend URL"
        default: "http://localhost:5173"
        required: false
      baseline:
        description: "Baseline pipeline_result.json to compare against"
        default: "baselines/v1_judged/pipeline_result.json"
        required: false
      score_drop:
        description: "Judge-score drop counted as a regression"
        default: "0.5"
        required: false
  schedule:
    # 03:00 UTC nightly. The machine must be on and LaRuche running.
    - cron: "0 3 * * *"

jobs:
  regression-gate:
    name: Run pipeline and detect regressions
    runs-on: [self-hosted]
    timeout-minutes: 60

    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'http://localhost:5173' }}
      BASELINE: ${{ github.event.inputs.baseline || 'baselines/v1_judged/pipeline_result.json' }}
      SCORE_DROP: ${{ github.event.inputs.score_drop || '0.5' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Verify the baseline exists
        # Failing here with a clear message beats failing later with a
        # confusing FileNotFoundError from the comparator.
        shell: bash
        run: |
          if [ ! -f "$BASELINE" ]; then
            echo "::error::No baseline at $BASELINE. Record one first and commit it."
            exit 1
          fi
          echo "Baseline: $BASELINE"

      - name: Check LaRuche and Ollama are reachable
        # The pipeline would otherwise "fail" every scenario for an
        # infrastructure reason and look like a catastrophic regression.
        shell: bash
        run: |
          fail=0
          for url in "$BASE_URL" http://localhost:8000/health \
                     http://localhost:8001/health http://localhost:8002/health; do
            if curl -sf --max-time 5 "$url" > /dev/null; then
              echo "  up   $url"
            else
              echo "  DOWN $url"
              fail=1
            fi
          done
          if ! curl -sf --max-time 5 http://localhost:11434/api/tags > /dev/null; then
            echo "  DOWN ollama (http://localhost:11434)"
            fail=1
          else
            echo "  up   ollama"
          fi
          if [ "$fail" = "1" ]; then
            echo "::error::The system under test is not fully up. Start the services before running the gate."
            exit 1
          fi

      - name: Run the QA pipeline
        shell: bash
        run: |
          python -m autonomous.graph.run \
            --corpus scenarios.json \
            --channel web \
            --base-url "$BASE_URL" \
            --ollama-judge

      - name: Locate the run that just finished
        id: candidate
        shell: bash
        run: python -m autonomous.graph.latest_run --github-output path

      - name: Compare against the baseline
        id: compare
        shell: bash
        # continue-on-error so the report still gets uploaded when a regression
        # is found; the gate is enforced by the explicit step below.
        continue-on-error: true
        run: |
          python -m autonomous.graph.compare \
            "$BASELINE" \
            "${{ steps.candidate.outputs.path }}" \
            --score-drop "$SCORE_DROP" \
            --markdown regression.md \
            --json regression.json \
            --fail-on-regression

      - name: Publish the report to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f regression.md ]; then
            cat regression.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No regression report was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the run and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-run-${{ github.run_number }}
          path: |
            regression.md
            regression.json
            runs/
          retention-days: 30

      - name: Fail the build if the agent got worse
        if: steps.compare.outcome == 'failure'
        shell: bash
        run: |
          echo "::error::Regressions detected — see the job summary and the uploaded report."
          exit 1
