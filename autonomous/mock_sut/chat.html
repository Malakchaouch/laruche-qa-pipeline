<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mock LaRuche chat</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; }
    .assistant-answer { background:#f4f4f5; border-radius:8px; padding:10px 14px; margin:8px 0; }
    .composer { display:flex; gap:8px; margin-top:16px; }
    .composer-input { flex:1; padding:10px; border:1px solid #d4d4d8; border-radius:8px; }
    .composer-primary { padding:10px 18px; border:0; border-radius:8px; background:#18181b; color:#fff; }
  </style>
</head>
<body>
  <h3>Mock LaRuche chat (streams like SSE)</h3>
  <div id="thread"></div>
  <div class="composer">
    <input class="composer-input" placeholder="Ask something..." />
    <button class="composer-primary">Send</button>
  </div>
  <script>
    // Same DOM contract as frontend/src/pages/Chat.tsx:
    //   input.composer-input / button.composer-primary / .assistant-answer
    // Reply streams char-by-char to exercise wait_text_stable.
    const REPLY = "Your total assets under management are approximately $20.4M across 48 deals.";
    const input = document.querySelector(".composer-input");
    const send  = document.querySelector(".composer-primary");
    send.addEventListener("click", () => {
      const q = input.value.trim();
      input.value = "";
      const div = document.createElement("div");
      div.className = "assistant-answer";
      document.getElementById("thread").appendChild(div);
      const text = q ? REPLY : "Please type a question first.";
      let i = 0;
      const timer = setInterval(() => {           // ~35 ms/char ≈ 2.7 s of streaming
        div.textContent = text.slice(0, ++i);
        if (i >= text.length) clearInterval(timer);
      }, 35);
    });
  </script>
</body>
</html>
